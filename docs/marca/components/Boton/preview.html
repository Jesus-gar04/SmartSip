<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;600;700&family=Caveat:wght@700&display=swap">
<style>
body{margin:0;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr}
.z{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);align-items:flex-start}
.p{background:var(--papel)}.w{background:var(--azul)}
button{font:700 16px/1 var(--font-display);border-radius:var(--radius-md);padding:15px 22px;border:2px solid transparent;cursor:pointer}
.pri{background:var(--azul);color:var(--blanco)}.pri:hover{background:var(--azul-hondo)}
.sec{background:transparent;color:var(--tinta);border-color:var(--tinta)}
.agua{background:var(--blanco);color:var(--azul-hondo)}
.agua2{background:transparent;color:var(--blanco);border-color:var(--blanco)}
</style></head><body>
<div class="z p"><button class="pri">Reservar el mío</button><button class="sec">Ver mi semana</button></div>
<div class="z w"><button class="agua">Registrar sorbo</button><button class="agua2">Ajustar meta</button></div>
</body></html>
